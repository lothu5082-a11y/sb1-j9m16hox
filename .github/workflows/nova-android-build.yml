name: Nova Android — Build Debug APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - 'nova-android/**'
      - '.github/workflows/nova-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle wrapper
        working-directory: nova-android
        run: gradle wrapper --gradle-version=8.7 --distribution-type=bin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('nova-android/**/*.gradle.kts', 'nova-android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: nova-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Print APK info
        run: |
          echo "=== Build complete ==="
          find nova-android/app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
