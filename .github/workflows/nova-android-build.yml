name: Nova Android — Build Debug APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - 'nova-android/**'
      - '.github/workflows/nova-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: nova-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Print APK size
        if: success()
        run: find nova-android/app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;
