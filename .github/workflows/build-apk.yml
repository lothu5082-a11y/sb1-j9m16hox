name: Build APK

on:
  push:
    branches: ["claude/android-offline-llm-mediapipe-xraaD", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle — download directly from official server ─────────────────
      #    Avoids "gradle: command not found" that occurs when the runner
      #    doesn't have Gradle pre-installed and no wrapper jar exists.
      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      # ── 4. Android SDK ─────────────────────────────────────────────────────
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Accept SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Install required SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --no_https 2>/dev/null || true

      # ── 5. Diagnose environment (visible in logs if something else fails) ──
      - name: Show environment info
        run: |
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms/" || echo "no platforms dir"
          ls "$ANDROID_SDK_ROOT/build-tools/" || echo "no build-tools dir"
          java -version

      # ── 6. Build ───────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # ── 7. Upload ──────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VexoraAI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
