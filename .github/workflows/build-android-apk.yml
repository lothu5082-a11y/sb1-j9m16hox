name: Build Vexsora APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/ai-chat-app-ui-h0DGq]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'constants/**'
      - 'package.json'
      - 'app.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/release.keystore \
            -storepass vexsora -alias vexsora -keypass vexsora \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Vexsora,O=Vexsora,C=US"

      # Build only arm64-v8a (every modern Android phone) so the native
      # llama.cpp compile is fast and the APK stays small.
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            -Pandroid.injected.signing.store.file=$HOME/.android/release.keystore \
            -Pandroid.injected.signing.store.password=vexsora \
            -Pandroid.injected.signing.key.alias=vexsora \
            -Pandroid.injected.signing.key.password=vexsora

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vexsora-v${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
