<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ShopBook</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 22rem; }
      .logo {
        width: 72px; height: 72px; border-radius: 18px; background: #2563eb;
        margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 32px; font-weight: 800;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #6b7280; line-height: 1.5; }
      code { background: #e5e7eb; padding: 2px 6px; border-radius: 6px; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">₿</div>
      <h1>ShopBook</h1>
      <p>
        This native shell needs your live web app URL. Set
        <code>CAP_SERVER_URL</code> (or edit <code>capacitor.config.ts</code>)
        to your deployed HTTPS address, then rebuild.
      </p>
    </div>
  </body>
</html>
